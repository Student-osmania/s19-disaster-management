# Requirement (c): HPAs for the two critical, CPU-bound services on the write path.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-intake
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: incident-intake}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 90
      policies: [{type: Pods, value: 1, periodSeconds: 30}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quorum-coordinator
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: quorum-coordinator}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 80}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 90
      policies: [{type: Pods, value: 1, periodSeconds: 30}]
