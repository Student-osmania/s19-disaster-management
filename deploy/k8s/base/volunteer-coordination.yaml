# Volunteer Coordination Service (Firestore)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-coordination
  labels: {app: volunteer-coordination, part-of: s19}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: volunteer-coordination}
  template:
    metadata:
      labels: {app: volunteer-coordination, part-of: s19}
    spec:
      serviceAccountName: s19-app
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: s19/volunteer-coordination
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: s19-cloud-config}
            - configMapRef: {name: s19-service-config}
          env:
            - name: SERVICE_NAME
              value: "volunteer-coordination"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false}
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-coordination
  labels: {app: volunteer-coordination, part-of: s19}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "s19-healthz"}'
spec:
  type: ClusterIP
  selector: {app: volunteer-coordination}
  ports:
    - {name: http, port: 8080, targetPort: http}
