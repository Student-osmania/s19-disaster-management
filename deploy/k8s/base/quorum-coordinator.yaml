# Quorum Coordinator (stateless; REST in, gRPC out to replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quorum-coordinator
  labels: {app: quorum-coordinator, part-of: s19}
spec:
  # replicas omitted on purpose: the HPA owns the replica count (Argo CD must not fight it)
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: quorum-coordinator}
  template:
    metadata:
      labels: {app: quorum-coordinator, part-of: s19}
    spec:
      serviceAccountName: s19-app
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: s19/quorum-coordinator
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: s19-cloud-config}
            - configMapRef: {name: s19-service-config}
          env:
            - name: SERVICE_NAME
              value: "quorum-coordinator"
            - name: WRITE_QUORUM
              value: "2"
            - name: READ_QUORUM
              value: "2"
            - name: RPC_TIMEOUT_MS
              value: "800"
            - name: ANTI_ENTROPY_INTERVAL_S
              value: "30"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: s19-secrets, key: ADMIN_TOKEN}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false}
---
apiVersion: v1
kind: Service
metadata:
  name: quorum-coordinator
  labels: {app: quorum-coordinator, part-of: s19}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "s19-healthz"}'
spec:
  type: ClusterIP
  selector: {app: quorum-coordinator}
  ports:
    - {name: http, port: 8080, targetPort: http}
