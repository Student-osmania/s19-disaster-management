# Prometheus + Grafana (kube-prometheus-stack Helm chart) with values taken from this repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.19.2
      helm:
        releaseName: kps
        valueFiles:
          - $values/deploy/platform/monitoring/values.yaml
    - repoURL: https://github.com/Student-osmania/s19-disaster-management.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - ServerSideApply=true      # the Prometheus Operator CRDs are too large for client-side apply
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
