# Grafana dashboard (ConfigMap picked up by the sidecar) + recording/alert rules
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: REPLACE_GIT_REPO_URL
    targetRevision: main
    path: deploy/platform/monitoring/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
