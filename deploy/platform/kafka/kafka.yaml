# Single-broker Apache Kafka 3.8 in KRaft mode (no ZooKeeper), self-managed on GKE.
# The assignment says the Kafka cluster "may" be a managed service; self-hosting avoids the
# hourly cost of Managed Service for Apache Kafka while keeping a real Kafka broker.
#   in-cluster clients : kafka.kafka.svc.cluster.local:9092   (listener INTERNAL)
#   Dataproc / Flink   : 10.10.0.100:9094                     (listener EXTERNAL via internal LB)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels: {app: kafka}
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: internal, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  selector: {app: kafka}
  ports:
    - {name: internal, port: 9092, targetPort: 9092}
---
# Internal passthrough Network Load Balancer on the static internal IP reserved by Terraform
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels: {app: kafka}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.100
  externalTrafficPolicy: Cluster
  selector: {app: kafka}
  ports:
    - {name: external, port: 9094, targetPort: 9094}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # IMPORTANT: a Service named "kafka" would inject KAFKA_PORT=tcp://... env vars, which the
      # apache/kafka image would misread as broker config. Disable service links.
      enableServiceLinks: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - {name: internal, containerPort: 9092}
            - {name: controller, containerPort: 9093}
            - {name: external, containerPort: 9094}
          env:
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka.kafka.svc.cluster.local:9092,EXTERNAL://10.10.0.100:9094"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/logs"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "24"}
            - {name: KAFKA_LOG_RETENTION_BYTES, value: "268435456"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m"}
          resources:
            requests: {cpu: 150m, memory: 640Mi}
            limits: {memory: 900Mi}
          readinessProbe:
            tcpSocket: {port: internal}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: internal}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests: {storage: 2Gi}
