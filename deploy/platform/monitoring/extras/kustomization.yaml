apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules.yaml
configMapGenerator:
  - name: s19-grafana-dashboard
    files:
      - dashboards/s19-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
