# Recording rules used by the Grafana dashboard (pre-aggregated RPS / error rate / p95 latency)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: s19-recording-rules
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: s19.http
      interval: 30s
      rules:
        - record: s19:http_rps:rate1m
          expr: sum by (service) (rate(http_requests_total[1m]))
        - record: s19:http_error_ratio:rate1m
          expr: |
            sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / clamp_min(sum by (service) (rate(http_requests_total[1m])), 0.001)
        - record: s19:http_latency_p95:rate1m
          expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[1m])))
    - name: s19.alerts
      rules:
        - alert: S19ReplicaDown
          expr: max by (replica) (quorum_replica_up) == 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Incident-store replica {{ $labels.replica }} is unreachable (quorum still OK with 2/3)"
        - alert: S19QuorumFailures
          expr: sum(rate(quorum_operations_total{result="quorum_failed"}[5m])) > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "Quorum reads/writes are failing - fewer than W or R replicas reachable"
