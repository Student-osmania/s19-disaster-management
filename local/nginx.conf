# Local API gateway: the same path routing as the GKE Ingress (deploy/k8s/base/ingress.yaml), so every
# script and curl command uses ONE base URL:  local http://localhost:8080   cloud http://<INGRESS_IP>
events {}
http {
  resolver 127.0.0.11 valid=10s;          # Docker's embedded DNS: services may start after nginx
  client_max_body_size 6m;
  map $uri $s19_upstream {
    ~^/api/incidents   incident-intake;
    ~^/api/resources   resource-registry;
    ~^/api/dispatch    dispatch;
    ~^/api/volunteers  volunteer-coordination;
    ~^/api/analytics   situation-analytics;
    ~^/api/quorum      quorum-coordinator;
    default            "";
  }
  server {
    listen 8080;
    location /api/ {
      if ($s19_upstream = "") { return 404; }
      proxy_pass http://$s19_upstream:8080$request_uri;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
    location = /healthz { return 200 "gateway ok\n"; }
  }
}
