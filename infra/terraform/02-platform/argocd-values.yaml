# Argo CD sized for a 2-3 node e2-standard-2 cluster. UI reached with kubectl port-forward (no LB cost).
global:
  logging:
    format: json
configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Health of child Applications is required for sync-wave ordering in app-of-apps
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
server:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
